<svg width="440" height="280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Corner vignette for depth -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="440" height="280" fill="#074016"/>

  <!-- Upward chevrons — Timbers crest motif, gold-tinted, very subtle -->
  <g stroke="#EDD132" fill="none" opacity="0.12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -100 180 L 220 -20 L 540 180" stroke-width="18"/>
    <path d="M -100 260 L 220  60 L 540 260" stroke-width="18"/>
    <path d="M -100 340 L 220 140 L 540 340" stroke-width="18"/>
    <path d="M -100 420 L 220 220 L 540 420" stroke-width="18"/>
  </g>

  <!-- Corner vignette overlay -->
  <rect width="440" height="280" fill="url(#vignette)"/>

  <!-- Logo mark — top right -->
  <image href="timber-mini.png" x="328" y="22" width="88" height="88"/>

  <!-- Left-side text stack -->
  <!-- PORTLAND — small label above the big title -->
  <text
    x="28" y="105"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="13" font-weight="700"
    fill="#EDD132"
    letter-spacing="4"
  >PORTLAND</text>

  <!-- TIMBERS — hero headline -->
  <text
    x="28" y="154"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="52" font-weight="900"
    fill="#F6F6F6"
    letter-spacing="3"
  >TIMBERS</text>

  <!-- MATCHDAY — gold sub-title -->
  <text
    x="28" y="194"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="34" font-weight="900"
    fill="#EDD132"
    letter-spacing="2"
  >MATCHDAY</text>

  <!-- Gold rule -->
  <rect x="28" y="208" width="180" height="5" rx="3" fill="#C9B420"/>

  <!-- Body copy -->
  <text
    x="28" y="241"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="17" font-weight="700"
    fill="#F6F6F6"
  >Never miss a match.</text>
</svg>
