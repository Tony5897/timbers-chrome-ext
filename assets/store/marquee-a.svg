<svg width="1400" height="560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Corner vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <!-- Mockup drop shadow -->
    <filter id="mockupShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="560" fill="#074016"/>

  <!-- Background chevrons — Timbers crest motif -->
  <g stroke="#EDD132" fill="none" opacity="0.10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -200 350 L 700 -150 L 1600 350" stroke-width="35"/>
    <path d="M -200 550 L 700  50 L 1600 550" stroke-width="35"/>
    <path d="M -200 750 L 700 250 L 1600 750" stroke-width="35"/>
    <path d="M -200 950 L 700 450 L 1600 950" stroke-width="35"/>
  </g>

  <!-- Corner vignette -->
  <rect width="1400" height="560" fill="url(#vignette)"/>

  <!-- ── LEFT SIDE — Brand lockup ── -->

  <!-- Logo mark — anchors the composition -->
  <image href="timber-mini.png" x="100" y="100" width="110" height="110"/>

  <!-- PORTLAND — small label, gold, above TIMBERS, aligned with logo right edge -->
  <text
    x="228" y="142"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="28" font-weight="700"
    fill="#EDD132"
    letter-spacing="6"
  >PORTLAND</text>

  <!-- TIMBERS — hero headline, aligns with logo's right edge -->
  <text
    x="228" y="248"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="108" font-weight="900"
    fill="#F6F6F6"
    letter-spacing="4"
  >TIMBERS</text>

  <!-- MATCHDAY — gold, full-width under logo+title -->
  <text
    x="100" y="358"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="96" font-weight="900"
    fill="#EDD132"
    letter-spacing="3"
  >MATCHDAY</text>

  <!-- Gold rule -->
  <rect x="100" y="378" width="530" height="7" rx="4" fill="#C9B420"/>

  <!-- Feature subheadline -->
  <text
    x="100" y="436"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="30" font-weight="700"
    fill="#F6F6F6"
  >Real-time countdown to every Timbers match</text>


  <!-- ── RIGHT SIDE — Extension mockup (Countdown feature) ── -->

  <!-- Mockup outer card -->
  <rect
    x="990" y="68" width="330" height="420" rx="18"
    fill="#0A1F05"
    stroke="#EDD132" stroke-width="1" stroke-opacity="0.35"
    filter="url(#mockupShadow)"
  />

  <!-- Mockup header strip -->
  <path d="M 990 86 Q 990 68 1008 68 L 1302 68 Q 1320 68 1320 86 L 1320 136 L 990 136 Z" fill="#183F10"/>
  <!-- Gold border under header -->
  <rect x="990" y="133" width="330" height="3" fill="#EDD132" opacity="0.8"/>

  <!-- Header: logo + app name -->
  <image href="timber-mini.png" x="1008" y="80" width="34" height="34"/>
  <text
    x="1052" y="95"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="11" font-weight="700"
    fill="#EDD132"
    letter-spacing="2"
  >PORTLAND TIMBERS</text>
  <text
    x="1052" y="113"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="13" font-weight="600"
    fill="#F6F6F6"
  >Matchday</text>

  <!-- Next Match card -->
  <rect x="1010" y="152" width="300" height="68" rx="10" fill="#183F10"/>
  <text
    x="1160" y="175"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="11" font-weight="700"
    fill="#C9B420"
    text-anchor="middle"
    letter-spacing="2"
  >NEXT MATCH</text>
  <text
    x="1160" y="200"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="17" font-weight="900"
    fill="#F6F6F6"
    text-anchor="middle"
  >Portland vs Seattle</text>

  <!-- Countdown card -->
  <rect x="1010" y="234" width="300" height="108" rx="10" fill="#0D2B07"/>
  <!-- Gold top accent line on countdown card -->
  <rect x="1010" y="234" width="300" height="4" rx="2" fill="#EDD132" opacity="0.6"/>
  <text
    x="1160" y="270"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="13" font-weight="700"
    fill="#EDD132"
    text-anchor="middle"
    letter-spacing="3"
  >KICKOFF IN</text>
  <text
    x="1160" y="322"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="36" font-weight="900"
    fill="#F6F6F6"
    text-anchor="middle"
    letter-spacing="1"
  >2d 14h 30m</text>

  <!-- Confidence poll card — teaser -->
  <rect x="1010" y="356" width="300" height="60" rx="10" fill="#183F10"/>
  <text
    x="1160" y="380"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="11" font-weight="700"
    fill="#C9B420"
    text-anchor="middle"
    letter-spacing="2"
  >TV / STREAM</text>
  <text
    x="1160" y="402"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="15" font-weight="700"
    fill="#EDD132"
    text-anchor="middle"
  >Apple TV · MLS Season Pass</text>

  <!-- Mockup footer bar -->
  <rect x="990" y="456" width="330" height="32" rx="0" fill="#183F10"/>
  <path d="M 990 456 L 1320 456 L 1320 474 Q 1320 488 1302 488 L 1008 488 Q 990 488 990 474 Z" fill="#183F10"/>
  <text
    x="1155" y="476"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="10" font-weight="600"
    fill="#A8B8A0"
    text-anchor="middle"
  >timbers.com · mlssoccer.com</text>
</svg>
