name: Support request
description: Ask for help with installation, match information, polling, or data deletion.
title: "Support: "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        This request will be public. Do not post Firebase IDs, authentication tokens, API keys, precise location, email addresses, or other personal information. Use the in-extension deletion control for community data whenever possible.
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Installation or update
        - Match information
        - Confidence polling
        - Community data deletion
        - Privacy question
        - Other
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: 1.0.5
  - type: textarea
    id: request
    attributes:
      label: How can we help?
      description: Describe the problem without including credentials or personal information.
    validations:
      required: true
  - type: checkboxes
    id: privacy-confirmation
    attributes:
      label: Public issue confirmation
      options:
        - label: I removed authentication tokens, IDs, keys, and personal information from this request.
          required: true
