name: Phase 0 Deployment

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Firebase and GitHub environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production
      component:
        description: Independently approved deployment component
        required: true
        type: choice
        options:
          - auth
          - indexes
          - api
          - temporary-rules
          - final-rules
      expected_commit_sha:
        description: Full commit SHA authorized for this deployment
        required: true
        type: string
      legacy_backup_uri:
        description: Immutable gs:// or https:// backup URI; required for rules deployments
        required: false
        type: string
      legacy_backup_sha256:
        description: Legacy backup SHA-256; required for rules deployments
        required: false
        type: string
      publication_timestamp:
        description: Chrome Web Store publication time in ISO 8601; required for final rules
        required: false
        type: string
      final_rules_confirmation:
        description: Enter DEPLOY FINAL RULES for the post-grace write denial
        required: false
        type: string

concurrency:
  group: phase0-${{ inputs.target_environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.component }} to ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment authorization
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          COMPONENT: ${{ inputs.component }}
          LEGACY_BACKUP_URI: ${{ inputs.legacy_backup_uri }}
          LEGACY_BACKUP_SHA256: ${{ inputs.legacy_backup_sha256 }}
          PUBLICATION_TIMESTAMP: ${{ inputs.publication_timestamp }}
          FINAL_RULES_CONFIRMATION: ${{ inputs.final_rules_confirmation }}
        run: |
          if [[ ! "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected commit must be a full lowercase SHA-1." >&2
            exit 1
          fi
          if [[ "$EXPECTED_COMMIT_SHA" != "$GITHUB_SHA" ]]; then
            echo "Expected commit does not match checked-out commit." >&2
            exit 1
          fi
          if [[ "$TARGET_ENVIRONMENT" == "production" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deployments must run from main." >&2
            exit 1
          fi
          if [[ "$COMPONENT" == "final-rules" && "$TARGET_ENVIRONMENT" != "production" ]]; then
            echo "Final migration rules are only valid for production." >&2
            exit 1
          fi
          if [[ "$COMPONENT" == "temporary-rules" || "$COMPONENT" == "final-rules" ]]; then
            if [[ ! "$LEGACY_BACKUP_URI" =~ ^(gs|https):// ]]; then
              echo "Rules deployment requires an immutable gs:// or https:// backup URI." >&2
              exit 1
            fi
            if [[ ! "$LEGACY_BACKUP_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "Rules deployment requires a valid legacy backup SHA-256." >&2
              exit 1
            fi
          fi
          if [[ "$COMPONENT" == "final-rules" ]]; then
            if [[ "$FINAL_RULES_CONFIRMATION" != "DEPLOY FINAL RULES" ]]; then
              echo "Final-rule confirmation phrase is invalid." >&2
              exit 1
            fi
            publication_epoch="$(date --date="$PUBLICATION_TIMESTAMP" +%s 2>/dev/null || true)"
            current_epoch="$(date +%s)"
            if [[ -z "$publication_epoch" || $((current_epoch - publication_epoch)) -lt 2592000 ]]; then
              echo "At least 30 days must have elapsed since confirmed Chrome Web Store publication." >&2
              exit 1
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Verify release candidate
        run: npm run verify:phase0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Run deployment preflight
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          COMPONENT: ${{ inputs.component }}
          LEGACY_BACKUP_URI: ${{ inputs.legacy_backup_uri }}
          LEGACY_BACKUP_SHA256: ${{ inputs.legacy_backup_sha256 }}
        run: |
          report="phase0-preflight-${TARGET_ENVIRONMENT}-${GITHUB_SHA}.json"
          arguments=(
            --require-environments
            --require-cloud-access
            --require-clean
            --target-environment "$TARGET_ENVIRONMENT"
            --commit-sha "$GITHUB_SHA"
            --output "$report"
          )
          if [[ "$COMPONENT" == "temporary-rules" || "$COMPONENT" == "final-rules" ]]; then
            arguments+=(
              --require-backup-evidence
              --backup-uri "$LEGACY_BACKUP_URI"
              --backup-sha256 "$LEGACY_BACKUP_SHA256"
            )
          fi
          npm run preflight:phase0 -- "${arguments[@]}"

      - name: Upload deployment preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase0-preflight-${{ inputs.target_environment }}-${{ inputs.component }}-${{ github.sha }}
          path: phase0-preflight-${{ inputs.target_environment }}-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Deploy indexes
        if: inputs.component == 'indexes'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: npx firebase-tools deploy --only firestore:indexes --project "$PROJECT_ID" --non-interactive

      - name: Deploy anonymous authentication configuration
        if: inputs.component == 'auth'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: npx firebase-tools deploy --only auth --project "$PROJECT_ID" --non-interactive

      - name: Deploy API
        if: inputs.component == 'api'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: npx firebase-tools deploy --only functions --project "$PROJECT_ID" --non-interactive

      - name: Deploy temporary migration rules
        if: inputs.component == 'temporary-rules'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: npx firebase-tools deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive

      - name: Deploy final migration rules
        if: inputs.component == 'final-rules'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: npx firebase-tools --config firebase.final.json deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive

      - name: Run API smoke tests
        if: inputs.component == 'api'
        env:
          API_BASE_URL: ${{ vars.MATCHDAY_API_BASE_URL }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          arguments=(--api-base-url "$API_BASE_URL" --output "phase0-smoke-${TARGET_ENVIRONMENT}-${GITHUB_SHA}.json")
          if [[ "$TARGET_ENVIRONMENT" == "staging" && -n "$FIREBASE_WEB_API_KEY" ]]; then
            arguments+=(--api-key "$FIREBASE_WEB_API_KEY" --authenticated)
          fi
          npm run smoke:phase0 -- "${arguments[@]}"

      - name: Upload smoke-test evidence
        if: always() && inputs.component == 'api'
        uses: actions/upload-artifact@v4
        with:
          name: phase0-smoke-${{ inputs.target_environment }}-${{ github.sha }}
          path: phase0-smoke-${{ inputs.target_environment }}-${{ github.sha }}.json
          if-no-files-found: warn
          retention-days: 90
